name: "Unity — Test License Personal"

on:
  workflow_dispatch:

jobs:
  test-license:
    name: Test Unity Personal License
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create minimal Unity project
        run: |
          mkdir -p TestProject/Assets
          mkdir -p TestProject/ProjectSettings
          cat > TestProject/ProjectSettings/ProjectVersion.txt << 'EOF'
          m_EditorVersion: 6000.0.23f1
          m_EditorVersionWithRevision: 6000.0.23f1 (0)
          EOF

      - name: Activate and test Unity license
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Run Unity headless
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          projectPath: TestProject
          buildTarget: StandaloneLinux64
          buildName: TestBuild
          allowDirtyBuild: true

      - name: Return license
        if: always()
        uses: game-ci/unity-return-license@v2

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-test-logs
          path: TestProject/Logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Resultado
        if: success()
        run: |
          echo "✅ LICENÇA OK — Unity activado com sucesso!"
