name: "Unity — Test License Personal"

on:
  workflow_dispatch:

jobs:
  test-license:
    name: Test Unity Personal License
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: Library-TestProject
          restore-keys: Library-

      - name: Create minimal Unity project
        run: |
          mkdir -p TestProject/Assets
          mkdir -p TestProject/ProjectSettings
          cat > TestProject/ProjectSettings/ProjectVersion.txt << 'EOF'
          m_EditorVersion: 6000.0.23f1
          m_EditorVersionWithRevision: 6000.0.23f1 (0)
          EOF
          cat > TestProject/ProjectSettings/ProjectSettings.asset << 'EOF'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            m_ObjectHideFlags: 0
            serializedVersion: 23
            companyName: TestCompany
            productName: TestProject
            productGUID: 00000000000000000000000000000000
          EOF

      - name: Build Unity (teste de licença)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          projectPath: TestProject
          buildTarget: StandaloneLinux64
          buildName: TestBuild
          allowDirtyBuild: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-test-logs
          path: |
            TestProject/Logs/
          retention-days: 7

      - name: Verificar resultado
        if: always()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║   ✅  Build concluído — Licença OK!      ║"
          echo "╚══════════════════════════════════════════╝"
