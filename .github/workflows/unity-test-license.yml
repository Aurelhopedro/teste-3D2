name: "Unity — Test License Personal"

on:
  workflow_dispatch:

jobs:
  test-license:
    name: Test Unity Personal License
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.0.23f1-base-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create minimal Unity project
        run: |
          mkdir -p TestProject/Assets
          mkdir -p TestProject/ProjectSettings
          cat > TestProject/ProjectSettings/ProjectVersion.txt << 'EOF'
          m_EditorVersion: 6000.0.23f1
          m_EditorVersionWithRevision: 6000.0.23f1 (0)
          EOF

      - name: Activate Unity Personal License via CLI
        run: |
          xvfb-run --auto-servernum unity-editor \
            -batchmode \
            -nographics \
            -logfile /tmp/activation.log \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -serial "" \
            -quit || true
          echo "=== Log de activação ==="
          cat /tmp/activation.log || true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Verificar activação
        run: |
          if grep -q "Next license update check is after" /tmp/activation.log 2>/dev/null || \
             grep -q "Storing license" /tmp/activation.log 2>/dev/null || \
             grep -q "License activated successfully" /tmp/activation.log 2>/dev/null; then
            echo ""
            echo "✅ LICENÇA ACTIVADA COM SUCESSO!"
          else
            echo ""
            echo "❌ FALHOU — Ver logs acima"
            grep -i "license\|error\|fail" /tmp/activation.log | tail -20
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-logs
          path: /tmp/*.log
          retention-days: 7
