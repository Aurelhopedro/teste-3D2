name: "2 — AXEV Infinigen Exterior"

on:
  workflow_dispatch:

jobs:
  build:
    name: Generate Exterior Terrain
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout teste-3D2
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libxi6 libxrender1 libxrandr2 libxxf86vm1 \
            libxfixes3 libxinerama1 curl ca-certificates \
            python3-pip python3-dev git cmake build-essential

      - name: Install Blender 4.2 LTS
        run: |
          BLENDER_URL="https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz"
          curl -L "$BLENDER_URL" -o /tmp/blender.tar.xz
          sudo tar -xf /tmp/blender.tar.xz -C /opt
          sudo ln -sf /opt/blender-4.2.9-linux-x64/blender /usr/local/bin/blender
          blender --version

      - name: Try install Infinigen (best-effort)
        run: |
          git clone --depth=1 https://github.com/princeton-vl/infinigen.git \
            "$GITHUB_WORKSPACE/infinigen" || true
          if [ -d "$GITHUB_WORKSPACE/infinigen" ]; then
            cd "$GITHUB_WORKSPACE/infinigen"
            pip install -e ".[base]" --quiet --no-warn-script-location || true
            echo "Infinigen install attempted"
          fi

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Generate AXEV Exterior
        run: |
          blender \
            --background \
            --factory-startup \
            --python "$GITHUB_WORKSPACE/scripts/generate_infinigen_exterior.py" \
            -- 2>&1 | tee "$GITHUB_WORKSPACE/output/blender.log"

      - name: Validate outputs
        run: |
          echo "=== Output files ==="
          ls -lh "$GITHUB_WORKSPACE/output/"

          GLB="$GITHUB_WORKSPACE/output/AXEV_Infinigen_Exterior.glb"
          if [ -f "$GLB" ]; then
            SIZE=$(stat -c%s "$GLB")
            echo "✅ GLB exported — $SIZE bytes"
          else
            echo "❌ GLB not found"
            tail -60 "$GITHUB_WORKSPACE/output/blender.log"
            exit 1
          fi

          RENDERS=$(ls "$GITHUB_WORKSPACE/output"/view_*.png 2>/dev/null | wc -l)
          echo "✅ Renders: $RENDERS PNG(s)"

          if [ -f "$GITHUB_WORKSPACE/output/report.json" ]; then
            echo "=== Report ==="
            cat "$GITHUB_WORKSPACE/output/report.json"
          fi

      - name: Upload AXEV-TEST-INFINIGEN-EXTERIOR
        uses: actions/upload-artifact@v4
        with:
          name: AXEV-TEST-INFINIGEN-EXTERIOR
          path: |
            output/AXEV_Infinigen_Exterior.glb
            output/view_*.png
            output/report.json
            output/blender.log
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          echo "## 🌲 AXEV Infinigen Exterior" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GITHUB_WORKSPACE/output/report.json" ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$GITHUB_WORKSPACE/output/report.json" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Artefact:** \`AXEV-TEST-INFINIGEN-EXTERIOR\`" >> $GITHUB_STEP_SUMMARY
