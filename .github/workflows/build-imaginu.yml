name: "5 — AXEV imaginu Pure GLB"

on:
  workflow_dispatch:

jobs:
  build:
    name: Generate GLB (imaginu / Pure Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout teste-3D2
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates python3 libxi6 libxrender1 \
            libxrandr2 libxxf86vm1 libxfixes3 libxinerama1

      - name: Install Blender 4.2 LTS (for rendering)
        run: |
          BLENDER_URL="https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz"
          curl -L "$BLENDER_URL" -o /tmp/blender.tar.xz
          sudo tar -xf /tmp/blender.tar.xz -C /opt
          sudo ln -sf /opt/blender-4.2.9-linux-x64/blender /usr/local/bin/blender
          blender --version

      - name: Install Rust (for imaginu crate — best-effort)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Generate AXEV imaginu GLB
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/generate_imaginu.py" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/generate.log"

      - name: Validate outputs
        run: |
          echo "=== Output files ==="
          ls -lh "$GITHUB_WORKSPACE/output/"

          GLB="$GITHUB_WORKSPACE/output/AXEV_imaginu.glb"
          if [ -f "$GLB" ]; then
            SIZE=$(stat -c%s "$GLB")
            echo "✅ GLB exported — $SIZE bytes"
            # validate GLB magic bytes
            MAGIC=$(xxd -l 4 "$GLB" | awk '{print $2$3}')
            echo "  GLB magic: $MAGIC (expect 676c5446)"
          else
            echo "❌ GLB not found"
            exit 1
          fi

          RENDERS=$(ls "$GITHUB_WORKSPACE/output"/view_*.png 2>/dev/null | wc -l)
          echo "✅ Renders: $RENDERS PNG(s)"

          if [ -f "$GITHUB_WORKSPACE/output/report.json" ]; then
            echo "=== Report ==="
            cat "$GITHUB_WORKSPACE/output/report.json"
          fi

      - name: Upload AXEV-TEST-IMAGINU
        uses: actions/upload-artifact@v4
        with:
          name: AXEV-TEST-IMAGINU
          path: |
            output/AXEV_imaginu.glb
            output/view_*.png
            output/report.json
            output/generate.log
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          echo "## ⚡ AXEV imaginu Pure GLB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GITHUB_WORKSPACE/output/report.json" ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$GITHUB_WORKSPACE/output/report.json" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Artefact:** \`AXEV-TEST-IMAGINU\`" >> $GITHUB_STEP_SUMMARY
