name: "Unity — Step 0: Verify Activation"

# ─────────────────────────────────────────────────────────────────────────
# PURPOSE
# Verify that Unity can be activated using your credentials.
# The old .alf / .ulf manual method is deprecated for Personal licenses.
# The current method uses UNITY_EMAIL + UNITY_PASSWORD directly.
#
# PRE-REQUISITES
# Add these 2 secrets in: Settings → Secrets → Actions
#
#   UNITY_EMAIL     → email da tua conta Unity
#   UNITY_PASSWORD  → password da tua conta Unity
#
# HOW TO USE
# 1. Add the secrets above.
# 2. Run this workflow manually (workflow_dispatch).
# 3. If it shows ✅ SUCCESS — activation works. Proceed to Test 01.
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.57f1

jobs:
  verify-activation:
    name: Verify Unity Activation
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write minimal Unity project fixture
        run: |
          mkdir -p TestProject/ProjectSettings
          cat > TestProject/ProjectSettings/ProjectVersion.txt << 'EOF'
          m_EditorVersion: 2022.3.57f1
          m_EditorVersionWithRevision: 2022.3.57f1 (0)
          EOF

      - name: Activate Unity (Personal License)
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Report result
        run: |
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║   ✅  SUCCESS — Unity activation OK      ║"
          echo "║   Proceed to: unity-first-launch.yml     ║"
          echo "╚══════════════════════════════════════════╝"
