name: "Unity — Step 0: Get Activation File"

# ─────────────────────────────────────────────────────────────────────────
# PURPOSE
# Run this workflow FIRST, before "unity-first-launch.yml".
# It generates a .alf file using the Unity Editor directly.
#
# HOW TO USE
# 1. Run this workflow manually (workflow_dispatch).
# 2. Download the artifact "activation-file" — extract the .alf file.
# 3. Go to https://license.unity3d.com and upload the .alf file.
# 4. Download the .ulf file they give you.
# 5. In your GitHub repo → Settings → Secrets → Actions, create:
#      UNITY_LICENSE   = paste the full contents of the .ulf file
#      UNITY_EMAIL     = your Unity account email
#      UNITY_PASSWORD  = your Unity account password
# 6. Now run "unity-first-launch.yml".
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.57f1

jobs:
  activation:
    name: Request activation file (.alf)
    runs-on: ubuntu-22.04

    steps:
      - name: Install Unity Editor
        uses: game-ci/unity-activate@v2
        id: unity
        with:
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Generate activation file (.alf)
        run: |
          /opt/unity/editors/${{ env.UNITY_VERSION }}/Editor/Unity \
            -batchmode \
            -createManualActivationFile \
            -logFile /tmp/unity-activation.log \
            || true
          echo "--- Unity log ---"
          cat /tmp/unity-activation.log || true
          ls -la *.alf || echo "No .alf found in current dir"
          ls -la /root/*.alf 2>/dev/null || true
          find / -name "*.alf" 2>/dev/null | head -20

      - name: Upload activation file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: activation-file
          path: "**/*.alf"
          retention-days: 3
          if-no-files-found: warn
