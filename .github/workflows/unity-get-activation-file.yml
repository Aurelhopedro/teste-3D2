name: "Unity — Step 0: Verify Activation"

# ─────────────────────────────────────────────────────────────────────────
# PURPOSE
# Verify that Unity Personal license can be activated using only
# email + password, without Unity Hub or .ulf file.
#
# PRE-REQUISITES
# Settings → Secrets → Actions → add:
#   UNITY_EMAIL     → email da conta Unity
#   UNITY_PASSWORD  → password da conta Unity
#
# HOW TO USE
# 1. Add the 2 secrets above.
# 2. Run this workflow manually (workflow_dispatch).
# 3. If ✅ SUCCESS → proceed to unity-first-launch.yml
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  verify-activation:
    name: Verify Unity Personal License
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Activate Unity Personal License
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Report SUCCESS
        run: |
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║   ✅  SUCCESS — Unity activation OK      ║"
          echo "║   Proceed to: unity-first-launch.yml     ║"
          echo "╚══════════════════════════════════════════╝"
