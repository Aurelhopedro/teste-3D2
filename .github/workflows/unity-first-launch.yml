name: "Unity — Test 01: First Launch"

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.0.23f1
  PROJECT_PATH: TestProject

jobs:
  test-unity-launch:
    name: Unity First Launch Test
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.0.23f1-base-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Activate Unity Personal License
        run: |
          xvfb-run --auto-servernum unity-editor \
            -batchmode \
            -nographics \
            -logfile /tmp/activation.log \
            -username "${{ secrets.UNITY_EMAIL }}" \
            -password "${{ secrets.UNITY_PASSWORD }}" \
            -quit || true
          echo "=== Activation Log ==="
          cat /tmp/activation.log || true

      - name: Create empty Unity project
        run: |
          mkdir -p ${{ env.PROJECT_PATH }}/Assets
          mkdir -p ${{ env.PROJECT_PATH }}/ProjectSettings
          cat > ${{ env.PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt << 'EOF'
          m_EditorVersion: 6000.0.23f1
          m_EditorVersionWithRevision: 6000.0.23f1 (0)
          EOF
          cat > ${{ env.PROJECT_PATH }}/ProjectSettings/ProjectSettings.asset << 'EOF'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            m_ObjectHideFlags: 0
            serializedVersion: 23
            companyName: TestCompany
            productName: TestProject
            productGUID: 00000000000000000000000000000000
          EOF

      - name: Open Unity project (import + compile test)
        id: unity_launch
        run: |
          xvfb-run --auto-servernum unity-editor \
            -batchmode \
            -nographics \
            -projectPath ${{ env.PROJECT_PATH }} \
            -logfile /tmp/unity.log \
            -quit || true
          echo "=== Unity Log ==="
          cat /tmp/unity.log || true

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: /tmp/*.log
          retention-days: 7

      - name: Report result
        if: always()
        run: |
          if grep -q "Exiting batchmode successfully" /tmp/unity.log 2>/dev/null; then
            echo "✅ SUCCESS — Unity launched and compiled OK"
          else
            echo "❌ FAILED — Check unity-logs artifact"
            grep -i "error\|failed\|exception" /tmp/unity.log | tail -20 || true
          fi
