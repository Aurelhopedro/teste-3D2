name: Unity - Request Activation File

on:
  workflow_dispatch: {}

jobs:
  request-activation-file:
    name: Request Activation File
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.0.23f1-base-3
    steps:
      - uses: actions/checkout@v4

      - name: Generate .alf activation file
        run: |
          xvfb-run --auto-servernum unity-editor \
            -batchmode \
            -createManualActivationFile \
            -logfile /tmp/unity.log || true
          echo "=== Unity Log ===" 
          cat /tmp/unity.log || true
          echo "=== Looking for .alf ==="
          find / -name "*.alf" 2>/dev/null | head -20

      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: activation-file
          path: "**/*.alf"
          if-no-files-found: warn
